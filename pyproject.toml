[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aladdin-wsp"
version = "1.0.0"
description = "Weight-space programming (direct tensor editing) for Hindi/Hinglish on Qwen3.5-0.8B. No LoRA, no fine-tuning, no gradient descent."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24", "requests>=2.28"]

[project.optional-dependencies]
gpu = ["torch>=2.3", "transformers>=4.46", "accelerate>=0.30",
       "huggingface_hub>=0.23", "safetensors>=0.4"]
dev = ["pytest>=7.4"]

[project.scripts]
aladdin = "aladdin.cli:main"

[tool.setuptools.packages.find]
include = ["aladdin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
